modLoader = "javafml"
loaderVersion = "${forge_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/ControlFlexMC/cfx-compat-cobblemon/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
side = "CLIENT"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "${controlflex_mod_id}"
mandatory = true
versionRange = "${controlflex_version_range_forge}"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "${cobblemon_mod_id}"
mandatory = true
versionRange = "${cobblemon_version_range_forge}"
ordering = "AFTER"
side = "CLIENT"
