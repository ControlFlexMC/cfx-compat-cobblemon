org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Gradle 8.8 cannot run on a JDK newer than 22. If your default JAVA_HOME is newer, export
# JAVA_HOME=<a supported JDK> before invoking the wrapper.

# Mod
mod_id=cfx_compat_cobblemon
mod_version=0.1.0
mod_name=Control Flex x Cobblemon
mod_authors=ifels
mod_license=MIT
mod_description=Battle screen action bridge for ControlFlex
maven_group=com.ifels

# Minecraft / loaders
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
fabric_loader_version=0.19.5
fabric_loader_min=>=0.16.0
fabric_api_min=>=0.101.2+1.21.1
fabric_api_version=0.116.17+1.21.1
neoforge_version=21.1.265
neoforge_version_range=[21.1,)
neoforge_loader_range=[4,)
java_version=21

# Runtime dependency mod ids (provided at runtime).
# Fabric metadata has no Maven bracket ranges, so strings use ">=".
controlflex_mod_id=controlflex
controlflex_version_range=>=0.8.9
cobblemon_mod_id=cobblemon
cobblemon_version_range=>=1.8.0

# NeoForge's mods.toml takes Maven ranges.
controlflex_version_range_neoforge=[0.8.9,)
cobblemon_version_range_neoforge=[1.8.0,)

# ControlFlex API (plain Java, loader-agnostic). 0.10.0 adds IActionBindingProvider;
# resolved from mavenLocal (tools/publish_maven_local.sh in control-flex-api).
controlflex_api_version=0.9.2.2
